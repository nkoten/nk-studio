<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>NK.DEV: Plano Estúdio 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Syne', sans-serif; }
    code, .mono { font-family: 'Space Mono', monospace; }

    :root {
      --bg: #0f0e17;
      --surface: #1a1828;
      --border: #2a2840;
      --amber: #f5a623;
      --amber-dim: #b87a1a;
      --teal: #00d4aa;
      --teal-dim: #007a63;
      --purple: #9d8cff;
      --purple-dim: #4a3fa0;
      --coral: #ff6b6b;
      --text: #e8e6f0;
      --muted: #7a7893;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glitch {
      0%, 100% { clip-path: none; transform: none; }
      92% { clip-path: none; transform: none; }
      93% { clip-path: polygon(0 20%, 100% 20%, 100% 22%, 0 22%); transform: translateX(-4px); }
      94% { clip-path: polygon(0 60%, 100% 60%, 100% 64%, 0 64%); transform: translateX(4px); }
      95% { clip-path: none; transform: none; }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px var(--amber), 0 0 20px var(--amber-dim); }
      50% { box-shadow: 0 0 16px var(--amber), 0 0 40px var(--amber-dim); }
    }
    @keyframes progress-fill {
      from { width: 0%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .scanline-overlay {
      pointer-events: none;
      position: fixed; inset: 0; z-index: 9999;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
    }

    .hero-title {
      animation: glitch 6s infinite;
    }

    .cursor-blink::after {
      content: '█';
      animation: blink 1s infinite;
      color: var(--amber);
    }

    .phase-card {
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .phase-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      transition: height 0.3s ease;
    }
    .phase-card:hover {
      border-color: var(--amber);
      transform: translateX(4px);
    }
    .phase-card.active {
      border-color: var(--amber);
    }
    .phase-card.active::before {
      background: var(--amber);
    }

    .neon-amber { color: var(--amber); text-shadow: 0 0 10px var(--amber-dim); }
    .neon-teal { color: var(--teal); text-shadow: 0 0 10px var(--teal-dim); }
    .neon-purple { color: var(--purple); text-shadow: 0 0 10px var(--purple-dim); }
    .neon-coral { color: var(--coral); }

    .glow-btn {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .grid-pattern {
      background-image:
        linear-gradient(rgba(42,40,64,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42,40,64,0.4) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .tag-chip {
      background: rgba(245,166,35,0.08);
      border: 1px solid rgba(245,166,35,0.25);
      color: var(--amber);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
    }

    .task-item {
      border-left: 2px solid var(--border);
      padding-left: 12px;
      transition: border-color 0.2s;
    }
    .task-item:hover {
      border-color: var(--teal);
    }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .timeline-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid var(--amber);
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
    }
    .timeline-dot.active {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .reveal { animation: fadeUp 0.6s ease forwards; }

    .viral-card {
      background: linear-gradient(135deg, rgba(157,140,255,0.08), rgba(0,212,170,0.05));
      border: 1px solid rgba(157,140,255,0.3);
    }

    .income-bar {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--teal), var(--amber));
      animation: progress-fill 1.5s ease forwards;
    }

    .floating { animation: float 4s ease-in-out infinite; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body class="bg-[#0f0e17] text-slate-200 min-h-screen">
  <div class="scanline-overlay"></div>
  <div id="app_root"></div>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6"
      }
    }
  </script>
  <script type="text/babel" data-type="module" src="./index.jsx"></script>
</body>
</html>
